name: python-selenium-pytest-bdd

on:
  push:
    branches: [main]
    paths:
      - "python-selenium-pytest-bdd/**"
      - ".github/workflows/python-selenium-pytest-bdd.yml"
  pull_request:
    paths:
      - "python-selenium-pytest-bdd/**"
      - ".github/workflows/python-selenium-pytest-bdd.yml"
  workflow_dispatch:
    inputs:
      workers:
        description: "pytest-xdist parallel worker count (must not exceed the 3-account user pool)"
        default: "3"
        type: string
      tag_filter:
        description: "pytest marker expression, e.g. smoke or negative (blank = all)"
        default: ""
        type: string
  schedule:
    # Nightly canary: catches saucedemo.com DOM/behaviour drift before it blocks a PR. Staggered an
    # hour after each of the other three frameworks' own nightly runs so all four don't hit the demo
    # site at the same moment.
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: python-selenium-pytest-bdd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Install dependencies
        # --locked asserts uv.lock still matches pyproject.toml (fails instead of silently
        # re-resolving), the same reproducibility contract `npm ci` gives the TS sibling.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Verify formatting
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy .

      - name: Validate worker count against the user pool
        # users/user_catalog.py's POOL_USERS has exactly 3 checkout-capable accounts (enforced at import
        # time by assigned_user.py) - a workflow_dispatch run asking for more workers than that would
        # assign the same account to two workers at once via the modulo wraparound, so fail fast here
        # instead of letting two scenarios collide on one saucedemo session.
        if: github.event_name == 'workflow_dispatch'
        env:
          WORKERS: ${{ inputs.workers }}
        run: |
          if [ "$WORKERS" -gt 3 ]; then
            echo "::error::workers=$WORKERS exceeds the 3-account user pool (users/user_catalog.py's POOL_USERS) - extra workers would collide on an already-assigned account."
            exit 1
          fi

      - name: Run tests (parallel, one saucedemo user per worker)
        # HEADLESS is not set here on purpose: appsettings.ci.json already forces Headless=true whenever
        # the standard CI=true env var is present (GitHub Actions sets it automatically), so this always
        # runs headless regardless of trigger. `tests/unit` rides along for free in the same invocation
        # since it lives under the same `testpaths = ["tests"]` root - no separate step needed.
        env:
          CI: "true"
          BASE_URL: "https://www.saucedemo.com/"
        run: |
          mkdir -p artifacts
          MARKER_ARGS=()
          if [ -n "${{ inputs.tag_filter }}" ]; then
            MARKER_ARGS=(-m "${{ inputs.tag_filter }}")
          fi

          uv run pytest \
            -n "${{ inputs.workers || 3 }}" \
            --alluredir=allure-results \
            --junitxml=artifacts/junit.xml \
            "${MARKER_ARGS[@]}"

      - name: Prepare Allure results
        if: always()
        run: cp categories.json allure-results/categories.json

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: python-selenium-pytest-bdd/allure-results
          retention-days: 14

      - name: Upload test results (junit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: python-selenium-pytest-bdd/artifacts
          retention-days: 14

      - name: Publish test results to the PR
        # Purely a nice-to-have PR annotation, never allowed to fail the job: fail-on-error only covers
        # "tests failed", not "couldn't find the report file", so continue-on-error is the actual safety
        # net here.
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v1
        with:
          name: pytest results
          path: "python-selenium-pytest-bdd/artifacts/junit.xml"
          reporter: java-junit
          fail-on-error: false

  report:
    name: Publish Allure report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      # peaceiris/actions-gh-pages pushes to the gh-pages branch via git, which needs write access
      # to contents - not pages/id-token (those are for the native actions/deploy-pages flow, unused here).
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # continue-on-error, not a hard dependency on the test job's outcome: if `test` fails before its
      # "Upload Allure results" step ever runs (e.g. an install/lint crash), there is no allure-results
      # artifact to download - that's an expected, already-reported failure, not a new one, so this job
      # should skip report generation quietly rather than fail loudly on top of it.
      - name: Download Allure results
        id: download-results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      # Installed via npm rather than a Docker-based report action, same reasoning as all three
      # siblings' workflows: ubuntu-latest already ships a JDK, so the Allure CLI needs no extra runtime.
      - name: Fetch previous report history (for trend graphs)
        if: steps.download-results.outcome == 'success'
        continue-on-error: true
        run: |
          if git fetch origin gh-pages --depth=1; then
            git worktree add /tmp/gh-pages FETCH_HEAD
            if [ -d /tmp/gh-pages/python-selenium/latest/history ]; then
              mkdir -p allure-results/history
              cp -r /tmp/gh-pages/python-selenium/latest/history/. allure-results/history/
            fi
          else
            echo "No gh-pages branch yet (first run) - skipping history import."
          fi

      - name: Install Allure CLI
        if: steps.download-results.outcome == 'success'
        run: npm install -g allure-commandline

      - name: Generate Allure report
        if: steps.download-results.outcome == 'success'
        run: allure generate allure-results --clean -o allure-report

      # A self-contained single HTML file, uploaded as its own downloadable Actions artifact - works
      # even if GitHub Pages isn't enabled for the repo (Pages for a private repo needs a paid plan to
      # be publicly reachable), and is easy to just open locally or share directly.
      - name: Generate single-file Allure report
        if: steps.download-results.outcome == 'success'
        run: allure generate allure-results --single-file --clean -o allure-report-single-file

      - name: Upload single-file Allure report
        if: steps.download-results.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-single-file
          path: allure-report-single-file/index.html
          retention-days: 14

      - name: Publish to GitHub Pages
        if: steps.download-results.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          destination_dir: python-selenium/${{ github.run_number }}
          keep_files: true

      - name: Publish "latest" alias
        if: steps.download-results.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          destination_dir: python-selenium/latest
          keep_files: false

      - name: Link report in job summary
        if: steps.download-results.outcome == 'success'
        run: |
          echo "### Allure report" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/python-selenium/${{ github.run_number }}/" >> "$GITHUB_STEP_SUMMARY"

      - name: Note skipped report generation
        if: steps.download-results.outcome != 'success'
        run: echo "::notice::No allure-results artifact was available (the test job likely failed before producing one) - report generation skipped."
