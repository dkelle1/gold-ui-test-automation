name: ts-playwright-test

on:
  push:
    branches: [main]
    paths:
      - "ts-playwright-test/**"
      - ".github/workflows/ts-playwright-test.yml"
  pull_request:
    paths:
      - "ts-playwright-test/**"
      - ".github/workflows/ts-playwright-test.yml"
  workflow_dispatch:
    inputs:
      project:
        description: "Browser engine to run"
        default: "chromium"
        type: choice
        options: [chromium, firefox, webkit, all]
      grep_filter:
        description: "Playwright --grep filter, e.g. @smoke or @negative (blank = all)"
        default: ""
        type: string
  schedule:
    # Nightly canary: catches saucedemo.com DOM/behaviour drift before it blocks a PR. Staggered an hour
    # after the other four frameworks' nightly runs (03:00-06:00) so they don't all hit the demo site at
    # the same moment. This one runs the full three-engine matrix, unlike PRs - see the run step.
    - cron: "0 7 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ts-playwright-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ts-playwright-test/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify formatting
        run: npm run format

      - name: Unit tests
        # Plain Node test-runner tests for the user-assignment logic - no browser involved. Run before
        # the UI suite so a broken pool assignment fails in seconds rather than after a browser launch.
        run: npm run test:unit

      # Which engines this run needs. A PR gets chromium only, to keep feedback fast; the nightly canary
      # and an explicit workflow_dispatch can ask for the full matrix. Computed once here so the browser
      # install, the test run and the cache key all agree.
      - name: Resolve browser projects
        id: projects
        env:
          REQUESTED: ${{ inputs.project }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$REQUESTED" = "all" ]; then
            echo "engines=chromium firefox webkit" >> "$GITHUB_OUTPUT"
            echo "playwright_args=" >> "$GITHUB_OUTPUT"
          else
            ENGINE="${REQUESTED:-chromium}"
            echo "engines=$ENGINE" >> "$GITHUB_OUTPUT"
            echo "playwright_args=--project=$ENGINE" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.projects.outputs.engines }}-${{ hashFiles('ts-playwright-test/package-lock.json') }}

      - name: Install Playwright browsers
        # --with-deps installs the OS-level shared libraries the engines need that a bare ubuntu-latest
        # runner doesn't ship. Only the engines this run will actually use are downloaded.
        run: npx playwright install --with-deps ${{ steps.projects.outputs.engines }}

      - name: Run tests
        # HEADLESS is not set here on purpose: appsettings.ci.json already forces Headless=true whenever
        # the standard CI=true env var is present (GitHub Actions sets it automatically), so this always
        # runs headless regardless of trigger.
        #
        # No worker-count validation step, unlike the Cucumber sibling's workflow: worker count is not an
        # input here at all. playwright.config.ts imports MAX_PARALLEL_WORKERS directly, and
        # assignedUser.ts fails at import time if the account pool is smaller than that - so an
        # over-provisioned run cannot be requested in the first place.
        env:
          CI: "true"
          BASE_URL: "https://www.saucedemo.com/"
        run: |
          GREP_ARGS=()
          if [ -n "${{ inputs.grep_filter }}" ]; then
            GREP_ARGS=(--grep "${{ inputs.grep_filter }}")
          fi

          npx playwright test ${{ steps.projects.outputs.playwright_args }} "${GREP_ARGS[@]}"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: ts-playwright-test/allure-results
          retention-days: 14

      - name: Upload Playwright HTML report
        # Self-contained and openable straight from the downloaded artifact - no CLI, no JDK, no Pages.
        # The Allure report published below is the cross-framework one with history and trends; this is
        # the zero-setup one, and it is free with the runner.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: ts-playwright-test/playwright-report
          retention-days: 14

      - name: Upload traces and videos
        # test-results/ only has content when something failed (trace: on-first-retry,
        # video/screenshot: *-on-failure), so this is normally an empty, near-free artifact.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: ts-playwright-test/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test results (json)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-json
          path: ts-playwright-test/artifacts
          retention-days: 14

  report:
    name: Publish Allure report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      # Every framework's report job pushes to the same gh-pages branch (each to its own namespaced
      # subdirectory, so there's nothing to serialize about the *content*) - but two concurrent
      # `git push origin gh-pages` calls race regardless, and the loser gets a plain "fetch first"
      # rejection with no retry. A concurrency group shared across every framework's report job queues
      # them instead of racing them; `cancel-in-progress: false` makes queued runs wait their turn.
      group: gh-pages-deploy
      cancel-in-progress: false
    permissions:
      # peaceiris/actions-gh-pages pushes to the gh-pages branch via git, which needs write access to
      # contents - not pages/id-token (those are for the native actions/deploy-pages flow, unused here).
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # continue-on-error, not a hard dependency on the test job's outcome: if `test` fails before its
      # "Upload Allure results" step ever runs (e.g. an install/typecheck crash), there is no
      # allure-results artifact to download - that's an expected, already-reported failure, not a new
      # one, so this job should skip report generation quietly rather than fail loudly on top of it.
      - name: Download Allure results
        id: download-results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Fetch previous report history (for trend graphs)
        if: steps.download-results.outcome == 'success'
        continue-on-error: true
        run: |
          if git fetch origin gh-pages --depth=1; then
            git worktree add /tmp/gh-pages FETCH_HEAD
            if [ -d /tmp/gh-pages/ts-playwright-test/latest/history ]; then
              mkdir -p allure-results/history
              cp -r /tmp/gh-pages/ts-playwright-test/latest/history/. allure-results/history/
            fi
          else
            echo "No gh-pages branch yet (first run) - skipping history import."
          fi

      # Installed via npm rather than a Docker-based report action, same reasoning as every sibling
      # workflow: ubuntu-latest already ships a JDK, so the Allure CLI needs no extra runtime.
      - name: Install Allure CLI
        if: steps.download-results.outcome == 'success'
        run: npm install -g allure-commandline

      - name: Generate Allure report
        if: steps.download-results.outcome == 'success'
        run: allure generate allure-results --clean -o allure-report

      - name: Generate single-file Allure report
        if: steps.download-results.outcome == 'success'
        run: allure generate allure-results --single-file --clean -o allure-report-single-file

      - name: Upload single-file Allure report
        if: steps.download-results.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-single-file
          path: allure-report-single-file/index.html
          retention-days: 14

      - name: Publish to GitHub Pages
        if: steps.download-results.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          destination_dir: ts-playwright-test/${{ github.run_number }}
          keep_files: true

      - name: Publish "latest" alias
        if: steps.download-results.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          destination_dir: ts-playwright-test/latest
          keep_files: false

      - name: Link report in job summary
        if: steps.download-results.outcome == 'success'
        run: |
          echo "### Allure report" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ts-playwright-test/${{ github.run_number }}/" >> "$GITHUB_STEP_SUMMARY"

      - name: Note skipped report generation
        if: steps.download-results.outcome != 'success'
        run: echo "::notice::No allure-results artifact was available (the test job likely failed before producing one) - report generation skipped."
