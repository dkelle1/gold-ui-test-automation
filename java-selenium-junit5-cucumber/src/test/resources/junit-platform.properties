# Cucumber's JUnit Platform engine reads its configuration from here. Command-line system properties
# (-D...) take precedence over this file, which is how scripts/run-tests.sh overrides the worker count
# and tag filter without editing anything.

# Scenario-level parallelism. Cucumber reports every scenario (and every Scenario Outline Examples row)
# as its own platform test, so "fixed parallelism = 3" means up to 3 scenarios in flight at once - each
# in its own browser, each logged in as its own saucedemo account. Unlike pytest-xdist in the Python
# sibling, these are threads inside ONE JVM, so the account hand-out has to be thread-safe: see
# users/UserPool.java.
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=3
cucumber.execution.parallel.config.fixed.max-pool-size=3

# Step definitions and hooks both live under this package root.
cucumber.glue=com.saucedemo.uitests

cucumber.plugin=pretty, io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm

# An undefined or ambiguous step should fail the build, not be quietly reported and skipped.
cucumber.execution.strict=true
cucumber.publish.quiet=true
